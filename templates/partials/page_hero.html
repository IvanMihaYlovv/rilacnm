{# Shown above the fold, so nothing here waits for the reveal animation. #}
<section class="page-hero">
  <div class="page-hero__bg" aria-hidden="true"><div class="hero__grid"></div><div class="hero__glow"></div></div>
  <div class="container">
    {% include 'partials/breadcrumbs.html' %}
    {% if page_eyebrow %}<p class="eyebrow">{{ page_eyebrow }}</p>{% endif %}
    <h1 class="page-hero__title">{{ page_heading }}</h1>
    {% if page_lead %}<p class="page-hero__lead">{{ page_lead }}</p>{% endif %}
  </div>
</section>
